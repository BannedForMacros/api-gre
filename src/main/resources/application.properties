# ApiGRE - configuracion por cliente
server.port=8181

# --- SQL Server del cliente (DataMart del ERP) -----------------------------
# encrypt=false + trustServerCertificate=true: SQL Server 2008 no negocia TLS moderno
spring.datasource.url=jdbc:sqlserver://localhost:1433;DatabaseName=db_cliente;encrypt=false;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=${SQLSRV_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000

# --- Negocio ---------------------------------------------------------------
gre.version=1.0.0
# Unica fuente de verdad del IGV en el lado servidor.
gre.igv.tasa=0.18

# --- Logs ------------------------------------------------------------------
logging.file.name=logs/api-gre.log
logging.level.pe.dbperu.gre=INFO
